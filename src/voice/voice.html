<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AEGIS — Multilingual Voice Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      text-align: center;
    }
    h1 { font-size: 22px; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
    p.subtitle { font-size: 13px; color: #64748b; margin-bottom: 24px; }
    select {
      width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1;
      border-radius: 8px; font-size: 14px; background: #ffffff;
      color: #0f172a; margin-bottom: 20px; outline: none;
    }
    select:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
    .mic-button {
      width: 110px; height: 110px; border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff; border: none; font-size: 42px; cursor: pointer;
      margin: 0 auto 20px; display: flex; justify-content: center; align-items: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
    }
    .mic-button:hover { transform: scale(1.05); box-shadow: 0 12px 30px rgba(37, 99, 235, 0.45); }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.6); }
      70% { box-shadow: 0 0 0 24px rgba(225, 29, 72, 0); }
      100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
    }
    .mic-button.recording { background: #e11d48; animation: pulse 1.5s infinite; }
    .transcript-box {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px;
      padding: 16px; min-height: 80px; font-size: 14px; color: #334155;
      text-align: left; margin-bottom: 20px; font-style: italic;
    }
    .extracted-box {
      background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px;
      padding: 14px; font-size: 13px; color: #166534; text-align: left; display: none;
    }
    .extracted-title { font-weight: 700; font-size: 12px; text-transform: uppercase; margin-bottom: 8px; }
    .tag {
      display: inline-block; background: #ffffff; border: 1px solid #86efac;
      padding: 3px 8px; border-radius: 6px; margin: 2px 4px 2px 0; font-weight: 500;
    }
    .btn-done {
      margin-top: 16px; padding: 10px 20px; background: #2563eb;
      color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Multilingual Voice Assistant</h1>
    <p class="subtitle">Speak details or tasks in your preferred language</p>

    <select id="voice-lang-select">
      <option value="en-US">English (US / India)</option>
      <option value="hi-IN">Hindi</option>
      <option value="bn-IN">Bengali</option>
      <option value="ta-IN">Tamil</option>
      <option value="te-IN">Telugu</option>
      <option value="mr-IN">Marathi</option>
      <option value="kn-IN">Kannada</option>
      <option value="gu-IN">Gujarati</option>
      <option value="ml-IN">Malayalam</option>
      <option value="pa-IN">Punjabi</option>
    </select>

    <button id="mic-btn" class="mic-button">&#127908;</button>

    <div id="transcript-box" class="transcript-box">
      Click the microphone and speak (e.g. "My name is Rahul, email is rahul@example.com")...
    </div>

    <div id="extracted-box" class="extracted-box">
      <div class="extracted-title">Extracted Profile Data:</div>
      <div id="extracted-tags"></div>
    </div>

    <button id="close-btn" class="btn-done">Done & Return to Chrome</button>
  </div>

  <script src="voice.js"></script>
</body>
</html>
